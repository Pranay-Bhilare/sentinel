global:
  scrape_interval: 5s

rule_files:
  - "alerts.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'victim'
    static_configs:
      - targets: ['victim_service:8001']
    metrics_path: /metrics
    scrape_interval: 5s